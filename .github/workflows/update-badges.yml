name: Update profile badges
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch counts from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/search/issues?q=author:saifullah-ai-engineer+type:pr&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_count'])")
          commits=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/search/commits?q=author:saifullah-ai-engineer&per_page=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_count'])")
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"Pull Requests","message":"%s","color":"blue"}' "$prs" > badges/prs.json
          printf '{"schemaVersion":1,"label":"Commits","message":"%s","color":"blue"}' "$commits" > badges/commits.json
      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/prs.json badges/commits.json
          git diff --cached --quiet || git commit -m "Update profile badge counts"
          git push
